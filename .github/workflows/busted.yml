name: busted

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: "5.2"

    - uses: leafo/gh-actions-luarocks@v5

    - name: setup
      run: |
        luarocks install busted

    - name: busted
      run: |
        busted -o utfTerminal
